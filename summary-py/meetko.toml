[package]
id = "meetko/summary-py"
version = "0.1.0"
kind = "plugin"
contract = "0.1"
license = "AGPL-3.0-or-later"
description = "회의 내용을 AI로 요약하고 할 일과 결정 사항을 뽑아줘요 (대화 텍스트가 선택한 AI 서비스로 전송돼요)"

[run]
command = ["python3", "-I", "-S", "plugin.py"]
protocol = "stdio-jsonrpc"

[input]
transcript = true
speakers = true
meeting = true
audio = "none"

[output]
display = ["summary_card", "action_items", "timeline_marker"]

[permissions]
network = true
secrets = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY"]
settings = ["ANTHROPIC_MODEL", "ANTHROPIC_BASE_URL", "OPENAI_BASE_URL", "OPENAI_MODEL"]
